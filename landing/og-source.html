<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #F2EDDE; overflow: hidden; position: relative;
         font-family: 'Instrument Sans', sans-serif; color: #2A1F1A; }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(#E2D8BE 1px, transparent 1px), linear-gradient(90deg, #E2D8BE 1px, transparent 1px);
    background-size: 56px 56px; opacity: 0.5; }
  .frame { position: absolute; inset: 28px; border: 1.5px solid #D6C9AC; border-radius: 22px; }
  .brand { position: absolute; top: 84px; left: 96px; display: flex; align-items: center; gap: 18px; }
  .brand img.mark { width: 54px; height: 54px; display: block; }
  .brand img.word { height: 24px; display: block; }
  .kicker { position: absolute; left: 96px; top: 308px;
    font-family: 'JetBrains Mono', monospace; font-size: 21px; font-weight: 500;
    letter-spacing: 0.22em; text-transform: uppercase; color: #B23A2C; }
  .title { position: absolute; left: 96px; top: 348px; width: 980px;
    font-family: 'Fraunces', serif; font-weight: 480; font-size: 76px; line-height: 1.08; letter-spacing: -0.015em; }
  .title code { font-family: 'JetBrains Mono', monospace; font-size: 0.78em; font-weight: 500;
    background: #2A1F1A; color: #EDE3CF; border-radius: 10px; padding: 2px 14px 6px; }
  .title em { font-style: italic; color: #B23A2C; }
  .sub { position: absolute; left: 96px; top: 548px; font-size: 24px; color: #6B5847; }
</style></head>
<body>
  <div class="grid"></div>
  <div class="frame"></div>
  <div class="brand">
    <img class="mark" src="brand/openground-mark.svg">
    <img class="word" src="brand/openground-wordmark.svg">
  </div>
  <div class="kicker">A local cockpit for Claude Code</div>
  <div class="title">Every <code>claude</code> terminal.<br>One <em>ground</em>.</div>
  <div class="sub">N terminal windows, folded onto one infinite canvas.</div>
</body></html>
