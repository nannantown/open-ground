<!doctype html>
<html lang="ja" class="font-vars">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPEN GROUND · the shore for your AI work</title>
    <meta
      name="description"
      content="A canvas to oversee every project on your machine."
    />
    <!-- Theme-adaptive SVG favicon (dark mode → cream mark, light mode → ink),
         transparent background. PNG fallback for browsers without SVG-favicon
         support. Both live under public/ so they resolve in dev and prod. -->
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="256x256" href="/brand/favicon-256.png" />
    <link rel="apple-touch-icon" href="/brand/favicon-256.png" />

    <!-- Fonts: SELF-HOSTED (public/fonts/ — Fraunces variable with the
         opsz/wght/SOFT axes, Instrument Sans, JetBrains Mono; OFL, see
         public/fonts/LICENSE.txt). Deliberately NOT Google Fonts links: the
         app must not dial Google on every window open — the font beacon was
         egress finding §8-8 in docs/SECURITY.md, and work mode (§12)
         promises zero non-Anthropic egress (srcdocLockdown.test.ts pins
         this file to zero external font hosts). The CSS variables below
         feed Tailwind's font-family tokens (--font-fraunces /
         --font-instrument-sans / --font-jetbrains-mono), matching
         tailwind.config.ts. -->
    <link href="/fonts/fonts.css" rel="stylesheet" />
    <style>
      .font-vars {
        --font-fraunces: 'Fraunces';
        --font-instrument-sans: 'Instrument Sans';
        --font-jetbrains-mono: 'JetBrains Mono';
      }
    </style>
    <!-- Theme pre-paint: stamp data-theme from the local mirror BEFORE first
         paint so a dark-mode user never sees a paper flash. localStorage is
         only the fast mirror — the source of truth is settings.json (`theme`),
         which src/lib/theme.ts re-applies (and re-mirrors) once /api/projects
         answers. Runs inline (no CSP on the SPA shell) and fails closed to
         light on any storage error. -->
    <script>
      try {
        if (localStorage.getItem('og-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
        }
      } catch {}
    </script>
  </head>
  <body class="font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
