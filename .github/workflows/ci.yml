name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run if a newer commit lands on the same branch —
# saves CI minutes and gives you the latest result first.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: lint + typecheck + build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 20 LTS. Pin a major to avoid surprise from new LTS lines
          # while staying in a still-supported window.
          node-version: '20'
          cache: 'npm'

      # node-pty's native rebuild (postinstall: electron-builder install-app-deps)
      # imports distutils, removed in Python 3.12. Runners default to 3.12 → pin 3.11.
      - name: Setup Python (node-gyp needs distutils)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # `npm ci` is faster + uses the exact lockfile contents (no resolution).
        # If install fails on a clean lock we want to see it loudly here, not
        # mid-shipping.
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        # Standalone tsc keeps the type feedback isolated and fast — the build
        # step below also typechecks (vite + esbuild) but failing here first
        # gives a cleaner error before we bother emitting artifacts.
        run: npx tsc --noEmit

      - name: check:screens (use-client lint for design modules)
        run: npm run check:screens

      - name: Build (vite web + esbuild server)
        # `npm run build` = `vite build` (dist-web/) + esbuild bundle
        # (server/dist/index.cjs). Vite + esbuild are fast, so building in the
        # quality gate is cheap and proves the shippable artifacts actually
        # emit — a typecheck pass alone doesn't guarantee a clean bundle.
        run: npm run build

      - name: Verify build artifacts exist
        # Existence + non-empty checks only. We do NOT `require()` the server
        # bundle here: loading server/dist/index.cjs would start the HTTP
        # server (binds the port, spawns nothing but blocks) — wrong for CI.
        # File presence + size is enough to confirm the build produced output.
        run: |
          test -f dist-web/index.html
          test -s dist-web/index.html
          test -f server/dist/index.cjs
          test -s server/dist/index.cjs
          echo "build artifacts present: dist-web/index.html + server/dist/index.cjs"

      - name: Unit tests (vitest)
        run: npm test

  worker:
    # The realtime-collab Cloudflare Worker (worker/) is an INDEPENDENT npm
    # package with its own package-lock.json, so it gets its own job: install
    # its deps, typecheck it, and run its in-process miniflare convergence test.
    # Runs in PARALLEL with quality-gate (no `needs`) — heavy wrangler/miniflare
    # boot stays off the fast app gate, and worker breakage gets its own signal.
    name: worker (typecheck + collab test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # The worker has its own lockfile — key the npm cache off it.
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        # Exact-lockfile install (partyserver, y-partyserver, yjs, wrangler, ws,
        # typescript, @cloudflare/workers-types). No node-gyp deps here, so no
        # Python pin is needed (unlike the root job's node-pty rebuild).
        run: npm ci
        working-directory: worker

      - name: Typecheck worker (tsc --noEmit)
        run: npx tsc --noEmit
        working-directory: worker

      - name: Worker collab test (miniflare, in-process)
        # node test/local.mjs boots the Worker via wrangler unstable_dev (local
        # miniflare) and asserts Yjs convergence, DO persistence, ticket gating,
        # R2 asset auth, and the zero-config /ticket mint — all in-process.
        run: node test/local.mjs
        working-directory: worker

  e2e:
    # Separate job so a fast quality-gate failure doesn't have to wait for the
    # slower e2e bootstrap (npm + playwright browser download + first compile).
    name: e2e (playwright smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Don't run e2e if the cheap checks fail — saves CI minutes and keeps the
    # signal-to-noise high on dependent-fail PRs.
    needs: quality-gate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python (node-gyp needs distutils)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # `--with-deps` pulls the missing apt packages chromium needs on a
        # bare ubuntu-latest runner. We only install chromium (not webkit /
        # firefox) — OPEN GROUND ships as a Chrome --app window so other
        # engines aren't a coverage target.
        run: npx playwright install chromium --with-deps

      - name: Run e2e (Playwright)
        # Playwright's webServer block in playwright.config.ts starts
        # `npm run dev` automatically and waits for the port to bind, so
        # we don't need a separate background job here.
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
