# Release pipeline — builds + publishes OPEN GROUND installers to a GitHub Release.
#
# Triggered by pushing a tag like `v1.2.3` (or run manually via workflow_dispatch).
# Two platforms build in parallel and publish to the SAME GitHub Release:
#   - macOS (macos-14, arm64): .dmg, code-signed + notarized
#   - Windows (windows-2022): .exe (NSIS), UNSIGNED (no Windows code-signing cert)
# A third job (`publish`) then flips the draft release public in the SAME run
# once both legs succeeded and every expected asset is present — no second
# dispatch needed (2026-08-28; publish-draft.yml remains the recovery path).
#
# Required repo Secrets (Settings → Secrets and variables → Actions):
#   CSC_LINK                      base64 of the Developer ID .p12 certificate
#                                 (create with: base64 -i DeveloperID.p12 | pbcopy)
#   CSC_KEY_PASSWORD              password for that .p12
#   APPLE_ID                      Apple ID email used for notarization
#   APPLE_APP_SPECIFIC_PASSWORD   app-specific password for that Apple ID
#   APPLE_TEAM_ID                 Apple Developer Team ID
#   GITHUB_TOKEN                  auto-provided by Actions — no manual setup needed
#
# Notes:
#   - `npm ci` runs the `postinstall` (electron-builder install-app-deps), which
#     rebuilds the node-pty native addon for the host platform. asar:false is set
#     in package.json so node-pty ships unpacked.
#   - electron-builder picks up signing/notarization from the standard env vars
#     above; Windows intentionally has none.

name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish when both builds succeed (false = stop at the untagged draft)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # Create the ONE draft release before the matrix fans out.
  #
  # WHY (measured 2026-08-17, v0.11.90): the two electron-builders each
  # find-or-create the release for the version tag, and that is a race — the
  # mac job's lookup missed the win job's minutes-old draft ("creating GitHub
  # release — reason=release doesn't exist"), built a SECOND draft, and
  # publish-draft then published the win-only one by tag. The mac assets
  # (including latest-mac.yml, i.e. mac auto-update) sat in an orphan draft.
  # With the draft created up front, both builders always find it and only
  # ever upload. repair-release.yml exists to mend a release this race (or
  # any upload failure) has already split.
  #
  # ⚠ electron-builder uploads into the existing draft and leaves it a draft.
  # Until 2026-08-28 closing the loop took a SECOND dispatch (publish-draft.yml);
  # now the `publish` job below does it IN-RUN for both trigger modes, once
  # every build leg is green and the asset roll-call passes. Measured on
  # v0.11.101: the second dispatch + its coordination wait cost 1–2 min per
  # release, while the two things the extra step actually checked (all legs
  # green; all assets in ONE draft — the split-race above) are exactly what
  # `needs: build` + the roll-call now enforce by machine. The PII guard still
  # fronts every build job, so nothing reaches publish unguarded.
  # publish-draft.yml remains as the recovery/notes-fix path.
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create the draft release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists — the builders will upload into it"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$VERSION" --notes ""
          fi

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
          # Pinned: `windows-latest` now redirects to the VS2026 image, which
          # node-gyp/node-pty's native rebuild can't find/use ("Could not find
          # any Visual Studio installation"). windows-2022 ships VS2022 C++ —
          # the known-good toolchain (what shipped v0.6.0–v0.8.0).
          - os: windows-2022
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # node-pty's native rebuild (via the old electron/node-gyp fork) imports
      # distutils, which Python 3.12 removed. The runners default to 3.12, so the
      # postinstall `electron-builder install-app-deps` fails with
      # "ModuleNotFoundError: No module named 'distutils'". Pin 3.11 (ships distutils).
      - name: Setup Python (node-gyp needs distutils)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      # PII guard — the tag's tree is exactly what ships publicly, so this is the
      # last line of defense: refuse to build a release from a tree that
      # reintroduces personal information (real-provider emails / home-path user
      # segments / banned tokens). src/repoPiiGuard.test.ts scans every tracked
      # text file; see docs/PII_SCRUB_RUNBOOK.md §8.
      - name: PII guard (refuse to release a tainted tree)
        run: npx vitest run src/repoPiiGuard.test.ts

      # Defensive clean. v0.11.7 built the CORRECT 0.11.7 git tree (verified: tag
      # tree == origin/main, swarm sources present) yet produced a 0.10.1 installer.
      # The only explanation is a stale dist-web/server/dist/dist-electron (or a
      # vite/esbuild cache) surviving into the build on the runner. Ephemeral
      # runners shouldn't carry these across runs, but wiping them before build is
      # free insurance against exactly this "right source, wrong artifact" class of
      # bug (observed 2026-06-25). Cross-platform: rimraf via node, no shell rm.
      - name: Clean stale build artifacts
        run: node -e "const {rmSync}=require('fs');for(const p of ['dist-web','server/dist','dist-electron','node_modules/.vite','node_modules/.cache'])try{rmSync(p,{recursive:true,force:true})}catch{}"

      - name: Build (web + server)
        run: npm run build
        # Bakes the PUBLIC build-time config into the packaged app via
        # scripts/write-runtime-config.js → electron/runtime-config.json, which
        # electron/main.js injects into the forked server's env at launch.
        #
        #   App login (SUPABASE_URL + anon key): so the toolbar's "Sign in"
        #   appears for end users. The anon key is a PUBLIC key — safe to ship;
        #   Row Level Security is the real boundary (docs/AUTH_SETUP.md §6 +
        #   REPORT.md). NEVER add SUPABASE_SERVICE_ROLE_KEY here.
        #
        #   Realtime collab (OPENGROUND_REALTIME + OPENGROUND_COLLAB_WS_URL):
        #   NO DEFAULT — collab ships OFF unless BOTH repo Variables are set
        #   explicitly (owner decision, 2026-08-23). These used to carry
        #   `|| '1'` / `|| 'wss://og-collab…'` fallbacks so a release "never
        #   silently ships with collab off". That inverted the real risk: with
        #   collab baked on, merely SIGNING IN and opening a project's Board or
        #   Canvas tab uploaded that project's whole contents to the operator's
        #   Cloudflare Durable Object — no share action, no consent on that path
        #   (the consent dialog gates only the invite flow), and no delete path
        #   for the cloud copy. See docs/COLLAB_STATUS.md §3 P0 and
        #   docs/SECURITY.md §8-1. Unset ⇒ write-runtime-config.js omits both
        #   keys ⇒ collabEnabled() is false ⇒ the SPA never even loads the
        #   yjs/y-partyserver chunk. Both are PUBLIC values (a feature flag and
        #   the public Worker WS endpoint the browser dials) — NOT credentials;
        #   the collab HMAC ticket secret lives ONLY on the Worker and is NEVER
        #   baked here. When collab is re-enabled for a release, set both repo
        #   Variables (Settings → Secrets and variables → Actions → Variables);
        #   the WS endpoint is then a fixed baked constant at runtime (main.js
        #   locks it against local env tampering — see its token-relay
        #   destination lock). The guard test that keeps this default OFF lives
        #   in server/__tests__/runtimeConfig.test.ts.
        #
        # If SUPABASE_* are absent, the script writes {} for them and login stays
        # disabled (graceful degrade); collab is independent.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OPENGROUND_REALTIME: ${{ vars.OPENGROUND_REALTIME }}
          OPENGROUND_COLLAB_WS_URL: ${{ vars.OPENGROUND_COLLAB_WS_URL }}

      - name: Build & publish (macOS, signed + notarized)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --arm64 --x64 --publish always
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & publish (Windows, unsigned)
        if: matrix.platform == 'win'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Flip the draft public in the SAME run (added 2026-08-28 — release latency).
  # `needs: build` only fires when EVERY matrix leg succeeded; the roll-call
  # below then refuses a split or half-uploaded draft (the v0.11.90 race class,
  # checked by machine instead of by eye). Any failure here leaves the ordinary
  # draft behind, mended and published by hand via repair-release.yml /
  # publish-draft.yml exactly as before. Dispatch with publish=false for a
  # build-only run that stops at the draft (the pre-2026-08-28 behaviour).
  publish:
    needs: build
    # Tag-push runs get the same in-run publish (auto-publish was their
    # behaviour before the draft job existed anyway).
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          NOTES_FILE="docs/release-notes/v$VERSION.md"
          # No committed notes ⇒ stay a draft. The in-app update banner and the
          # landing footer surface the release body, so publishing with an empty
          # body is worse than waiting for publish-draft.yml with a real file.
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::$NOTES_FILE is not in the tree — leaving $TAG a draft"
            exit 1
          fi
          # Roll-call: exact, version-anchored names (asset list measured on
          # v0.11.101). Blockmaps excluded — delta-update extras with unstable
          # naming, not the install set. A missing name fails the job and the
          # draft stays private.
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for want in \
            "latest-mac.yml" \
            "latest.yml" \
            "OPEN-GROUND-$VERSION-arm64.dmg" \
            "OPEN-GROUND-$VERSION-x64.dmg" \
            "OPEN-GROUND-$VERSION-arm64.zip" \
            "OPEN-GROUND-$VERSION-x64.zip" \
            "OPEN-GROUND-Setup-$VERSION.exe"; do
            if ! grep -qxF "$want" <<<"$assets"; then
              echo "::error::draft $TAG is missing asset '$want' — leaving it a draft"
              printf 'present assets:\n%s\n' "$assets"
              exit 1
            fi
          done
          # Re-runnable: on an ALREADY-PUBLISHED release edit the body alone —
          # re-sending --target/--latest/--draft on a published release comes
          # back 403 from the Actions token (measured v0.11.91, 2026-08-18, in
          # publish-draft.yml — same logic kept verbatim).
          already=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$already" = "false" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES_FILE"
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest --target "$TARGET" --notes-file "$NOTES_FILE"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName,url
