# Release pipeline — builds + publishes OPEN GROUND installers to a GitHub Release.
#
# Triggered by pushing a tag like `v1.2.3` (or run manually via workflow_dispatch).
# Two platforms build in parallel and publish to the SAME GitHub Release:
#   - macOS (macos-14, arm64): .dmg, code-signed + notarized
#   - Windows (windows-2022): .exe (NSIS), UNSIGNED (no Windows code-signing cert)
#
# Required repo Secrets (Settings → Secrets and variables → Actions):
#   CSC_LINK                      base64 of the Developer ID .p12 certificate
#                                 (create with: base64 -i DeveloperID.p12 | pbcopy)
#   CSC_KEY_PASSWORD              password for that .p12
#   APPLE_ID                      Apple ID email used for notarization
#   APPLE_APP_SPECIFIC_PASSWORD   app-specific password for that Apple ID
#   APPLE_TEAM_ID                 Apple Developer Team ID
#   GITHUB_TOKEN                  auto-provided by Actions — no manual setup needed
#
# Notes:
#   - `npm ci` runs the `postinstall` (electron-builder install-app-deps), which
#     rebuilds the node-pty native addon for the host platform. asar:false is set
#     in package.json so node-pty ships unpacked.
#   - electron-builder picks up signing/notarization from the standard env vars
#     above; Windows intentionally has none.

name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
          # Pinned: `windows-latest` now redirects to the VS2026 image, which
          # node-gyp/node-pty's native rebuild can't find/use ("Could not find
          # any Visual Studio installation"). windows-2022 ships VS2022 C++ —
          # the known-good toolchain (what shipped v0.6.0–v0.8.0).
          - os: windows-2022
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # node-pty's native rebuild (via the old electron/node-gyp fork) imports
      # distutils, which Python 3.12 removed. The runners default to 3.12, so the
      # postinstall `electron-builder install-app-deps` fails with
      # "ModuleNotFoundError: No module named 'distutils'". Pin 3.11 (ships distutils).
      - name: Setup Python (node-gyp needs distutils)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      # Defensive clean. v0.11.7 built the CORRECT 0.11.7 git tree (verified: tag
      # tree == origin/main, swarm sources present) yet produced a 0.10.1 installer.
      # The only explanation is a stale dist-web/server/dist/dist-electron (or a
      # vite/esbuild cache) surviving into the build on the runner. Ephemeral
      # runners shouldn't carry these across runs, but wiping them before build is
      # free insurance against exactly this "right source, wrong artifact" class of
      # bug (observed 2026-06-25). Cross-platform: rimraf via node, no shell rm.
      - name: Clean stale build artifacts
        run: node -e "const {rmSync}=require('fs');for(const p of ['dist-web','server/dist','dist-electron','node_modules/.vite','node_modules/.cache'])try{rmSync(p,{recursive:true,force:true})}catch{}"

      - name: Build (web + server)
        run: npm run build
        # Bakes the PUBLIC build-time config into the packaged app via
        # scripts/write-runtime-config.js → electron/runtime-config.json, which
        # electron/main.js injects into the forked server's env at launch.
        #
        #   App login (SUPABASE_URL + anon key): so the toolbar's "Sign in"
        #   appears for end users. The anon key is a PUBLIC key — safe to ship;
        #   Row Level Security is the real boundary (docs/AUTH_SETUP.md §6 +
        #   REPORT.md). NEVER add SUPABASE_SERVICE_ROLE_KEY here.
        #
        #   Realtime collab (OPENGROUND_REALTIME + OPENGROUND_COLLAB_WS_URL): so
        #   collab auto-enables for logged-in users in the shipped app. Both are
        #   PUBLIC values (a feature flag and the public Worker WS endpoint the
        #   browser dials) — NOT credentials. The collab HMAC ticket secret lives
        #   ONLY on the Worker and is NEVER baked here. These read from repo
        #   Variables (Settings → Secrets and variables → Actions → Variables),
        #   with the public constant as a fallback so a release never silently
        #   ships with collab off if the Var is unset. The WS endpoint is treated
        #   as a fixed baked constant at runtime (main.js locks it against local
        #   env tampering — see its token-relay destination lock).
        #
        # If SUPABASE_* are absent, the script writes {} for them and login stays
        # disabled (graceful degrade); collab is independent.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OPENGROUND_REALTIME: ${{ vars.OPENGROUND_REALTIME || '1' }}
          OPENGROUND_COLLAB_WS_URL: ${{ vars.OPENGROUND_COLLAB_WS_URL || 'wss://og-collab.mindbrew.workers.dev' }}

      - name: Build & publish (macOS, signed + notarized)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --arm64 --x64 --publish always
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & publish (Windows, unsigned)
        if: matrix.platform == 'win'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
